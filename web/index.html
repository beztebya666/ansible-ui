<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>ansible-ui · control plane</title>
    <meta name="description" content="A fast, minimal control plane for Ansible with a native live terminal." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme/lang before React mounts to avoid a flash.
      try {
        var th = localStorage.getItem("aui.theme") || "dark";
        document.documentElement.dataset.theme = th;
        document.documentElement.lang = localStorage.getItem("aui.lang") || "en";
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
