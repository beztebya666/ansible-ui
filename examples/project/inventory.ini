# Demo inventory — everything runs locally so the examples work with no
# remote hosts, SSH keys, or credentials. Swap in real hosts to go to prod.

[local]
localhost ansible_connection=local

# A couple of "logical" hosts that also map to localhost, so playbooks that
# loop over a group produce rich, multi-host output in the terminal.
[web]
web01 ansible_connection=local ansible_host=127.0.0.1 server_role=frontend
web02 ansible_connection=local ansible_host=127.0.0.1 server_role=frontend

[db]
db01 ansible_connection=local ansible_host=127.0.0.1 server_role=database

[datacenter:children]
web
db

[all:vars]
ansible_python_interpreter=auto_silent
env=demo
