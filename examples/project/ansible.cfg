[defaults]
# --- Output: make every run look gorgeous in the live terminal ---
force_color = True
nocows = True
stdout_callback = default
# Keep the log clean & to-the-point, like Semaphore: just PLAY / TASK / RECAP.
# We deliberately do NOT enable profile_tasks / timer — they bolt a timing line
# under every task plus a TASKS/PLAYBOOK RECAP + "Playbook run took …" tail, which
# is noise in the live log (the run's duration is already shown in the UI).

# --- Inventory & connection (localhost-safe demo) ---
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
gathering = smart
fact_caching = memory

# --- Roles discovery (collections use ansible's default search path). ---
roles_path = roles

# --- Vault: a demo password file ships with the project so the vault
#     playbook runs out-of-the-box. (Demo only — never commit real secrets.) ---
vault_password_file = .vault_pass

[diff]
always = True
context = 3

[ssh_connection]
pipelining = True
